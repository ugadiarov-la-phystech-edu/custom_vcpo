hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

async_training:

  # Maximum samples staleness threshold
  staleness_threshold: 0.1

  # Frequency of parameter synchronization between rollouter and trainer, 
  # One step means trainer obtains a batch of required samples
  trigger_parameter_sync_step: 4
  
  # The number of ppo_mini_batches that the FullyAsyncTrainer obtains once
  require_batches: 1

  # Non-integer scheduled PPO epochs over each pulled batch (driver-side).
  # null keeps the single whole-batch update_actor call (worker-internal
  # mini-batch loop over require_batches mini-batches). A float f instead runs
  # max(1, round(f * require_batches)) group-complete shuffled mini-batch
  # updates, reshuffled each epoch: with require_batches=4, f=0.25 trains on
  # one random mini-batch (a quarter of the pull), f=1.0 covers the whole
  # batch once in shuffled order, f=1.5 adds a reshuffled half replay.
  ppo_epochs: null

  # Seed for the per-step group shuffle of the fractional ppo_epochs path
  ppo_epochs_shuffle_seed: 1234

  # When synchronizing parameters, whether to interrupt rollouter and perform partial rollout
  partial_rollout: True

  # Whether to use rollout log probs for training
  use_rollout_log_probs: True

  # Skip old log-prob recomputation and use policy/rollout ratio in backward pass
  skip_recompute_old_log_prob: False

  # compute_prox_log_prob
  compute_prox_log_prob: False

  # save partial rollouts and completed rollouts in the replay buffer queue
  save_queue_state: True

  # Opportunistic PPO epochs (rollout-bound elasticity): after the scheduled
  # update, keep running extra shuffled group-complete mini-batch updates on the
  # current batch while the queue holds fewer than
  # ppo_mini_batch_size*require_batches samples. The queue is re-checked before
  # every extra mini-batch, so an extra epoch shrinks (or never starts) the
  # moment the next batch is ready — dormant in trainer-bound runs.
  opportunistic_epochs:

    # Master switch; False keeps the trainer exactly as before
    enable: False

    # Hard cap on extra epochs per trainer step. Bounds reuse during rollouter
    # pauses (validation / checkpoint saves), when "no new data" holds for minutes
    max_extra_epochs: 3

    # Seed for the per-step group-level shuffle of extra mini-batches
    shuffle_seed: 1234

  # Elastic DAPO-style dynamic filtering (rollouter-side): score each completed
  # prompt-group with the rule-based reward at the rollouter and drop groups
  # with zero advantage variance (all-correct / all-wrong) — but ONLY while the
  # message queue already buffers >= min_buffered_batches full trainer batches.
  # Trainer-bound -> filtering runs at full strength and the freed staleness
  # quota licenses replacement generation for free; rollout-bound -> everything
  # passes through untouched. Dropped groups are counted in
  # count/filtered_degenerate_groups. Note: rollout.total_rollout_steps still
  # counts *fed* prompts, so heavy filtering shortens the trained-step horizon
  # proportionally.
  dynamic_filtering:

    # Master switch
    enable: False

    # Buffered-batch threshold (in units of full trainer batches) above which
    # degenerate groups are dropped
    min_buffered_batches: 1.0

  # Replay-buffer training mode: decouple generation from updating. The
  # rollouter scores every completed group and drops zero-advantage-variance
  # ones (DAPO filtering, always on), freezing GRPO advantages and behavior
  # log-probs at insertion. The trainer keeps drained groups in a
  # version-aware buffer, composes each optimizer mini-batch
  # (ppo_mini_batch_size groups) as all not-yet-trained-on groups (oldest
  # first) plus a sample of used groups weighted by 2^(-staleness/tau), syncs
  # weights after EVERY update (requires trigger_parameter_sync_step=1,
  # require_batches=1, skip_recompute_old_log_prob=True), evicts groups
  # staler than staleness_threshold updates, and pauses only while the buffer
  # holds fewer than requires_mini_batches full mini-batches.
  replay_buffer:

    # Master switch; False keeps the FIFO trainer exactly as before
    enable: False

    # Score half-life in model updates: score = 2^(-group_staleness / tau)
    tau: 4.0

    # Evict groups whose version < current_model_version - staleness_threshold
    # (measured in model updates; align async_training.staleness_threshold
    # with this so generation is not licensed beyond what eviction keeps)
    staleness_threshold: 8

    # Both the warm-up length and the pause watermark; may be fractional
    # (e.g. 1.5). Warm-up: the first ceil(requires_mini_batches) updates each
    # consume a fresh mini-batch of unseen groups. Watermark: training pauses
    # while the buffer holds < requires_mini_batches * ppo_mini_batch_size groups
    requires_mini_batches: 2

    # Seed for the weighted without-replacement sampling of replayed groups
    sampling_seed: 1234

  # Dynamic estimation of the ESS-scaling reference (base_ess_ratio) in
  # replay_buffer mode. Requires ess_scaling.enable=True with
  # base_ess_ratio=null. See recipe/fully_async_policy/ess_base_estimator.py.
  ess_base_estimator:

    # first_update: freeze the first update's measured ESS ratio (legacy
    # auto-calibration). new_cohort: EMA of the fresh (not-yet-trained-on)
    # cohort's pooled ESS — the brake then measures replay excess relative to
    # the freshest data the pipeline delivers.
    mode: first_update

    # EMA coefficient applied per fold (a fold = min_seqs pooled sequences)
    beta: 0.05

    # Fresh sequences pooled (sum w, sum w^2) before the EMA folds once;
    # per-cohort ESS ratios never enter the EMA directly (small-sample bias)
    min_seqs: 64

    # Floor: keep the reference above the degenerate ESS floor 1/B so the
    # brake can never become structurally unable to engage
    clamp_min: 0.002

    # Ceiling; null = the first-update capture ("never brake harder than the
    # legacy auto-calibration would")
    clamp_max: null

    # Quote the reference at the current minibatch's mean response length via
    # base = exp(-sigma^2 * L) with sigma^2 implied by the fresh cohort's ESS
    # at its own mean length (lognormal weight model)
    length_correction: False

    # Winsorize the single largest fresh-cohort weight to the second largest
    # before pooling (one heavy-tail outlier must not crush the reference)
    winsor_top1: True

    # Sliding window (in updates) of staleness-bucket points for the s->0
    # regression diagnostic (rho_on estimate; never used for braking)
    window: 100

  # Stop-the-world validation: after a sync that triggers validation, the
  # trainer blocks until the validation sweep completes instead of training
  # ahead on backlog. With generation already paused, the whole pipeline
  # freezes — a pure time translation — so the trajectory and
  # cumulative_training_time match a no-validation run exactly (the stall is
  # excluded from the clock). Costs the lost overlap: wall time grows by
  # roughly the validation time per test.
  serialize_validation: False

  # Stop-the-world checkpoint saves: freeze generation for the entire save
  # (trainer dist-ckpt + rollouter state), not just the queue-snapshot window,
  # so saves are also a pure time translation instead of building a queue
  # surplus. The full pause shifts sample stamps and is excluded from
  # cumulative_training_time.
  pause_generation_during_save: False

# Rollout config
rollout:

  # Number of nodes used in the rollout
  nnodes: 1

  # Number of GPUs per node                     
  n_gpus_per_node: 8

  # number of responses (i.e. num sample times). > 1 for grpo
  n: 4

  # total rollout samples # TODO rename to total_rollout_samples
  total_rollout_steps: 100

  # Number of epochs in training 
  total_epochs: 10

  # Test frequency, how many times a parameter update triggers a validation
  test_freq: 1

data:
  # Number of samples generated, currently only support 1
  gen_batch_size: 1

actor_rollout_ref:
  actor:
    # Whether to use rollout log probs for training
    use_rollout_log_probs: ${oc.select:async_training.use_rollout_log_probs, True}
